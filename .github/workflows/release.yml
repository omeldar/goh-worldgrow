name: release

# Tag a commit and the jar ships itself:
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Check the tag matches mod_version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MOD=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "$TAG" != "$MOD" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match mod_version=$MOD in gradle.properties"
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
